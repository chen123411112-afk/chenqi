<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>音乐馆</title>
<script>try{var t=localStorage.getItem('theme');if(!t){var h=new Date().getHours();t=(h>=19||h<6)?'dark':'light'}document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..500;1,9..144,200..400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..500;1,9..144,200..400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap"></noscript>
<style>
  :root{
    --bg:#f6f5f2; --ink:#14130f; --soft:#4a4842; --mute:#9b988f; --line:rgba(20,19,15,.08);
    --gold:#b8976a; --gold-l:#e3d3b4; --glass:rgba(255,255,255,.72);
    --shadow:0 1px 2px rgba(20,19,15,.04),0 12px 28px -12px rgba(20,19,15,.10),0 40px 80px -40px rgba(20,19,15,.16);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{
    min-height:100vh; color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif; font-weight:400;
    background:
      radial-gradient(60% 40% at 15% 0%, #fff 0%, transparent 70%),
      radial-gradient(50% 40% at 90% 20%, rgba(227,211,180,.35) 0%, transparent 70%),
      radial-gradient(60% 50% at 50% 100%, rgba(255,255,255,.9) 0%, transparent 70%),
      var(--bg);
    background-attachment:fixed;
    animation:fade 1.2s cubic-bezier(.25,.1,.25,1) both;
  }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .wrap{ max-width:860px; margin:0 auto; padding:0 28px; }
  .marquee,.np-label,.time-row,.section-tag,.track-num,.track-dur,footer{ font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-weight:300; }

  /* HERO */
  header.hero{ padding:80px 0 12px; }
  .marquee{ display:flex; justify-content:space-between; align-items:center; font-size:.68rem; letter-spacing:.3em; color:var(--mute); text-transform:uppercase; margin-bottom:56px; }
  .marquee .live{ color:var(--ink); }
  .marquee .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:12px; background:linear-gradient(135deg,var(--gold-l),var(--gold)); box-shadow:0 0 0 4px rgba(184,151,106,.15); animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 8px rgba(184,151,106,0); } }
  .hero-title{ font-family:'Fraunces','Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif; font-weight:300; font-size:clamp(3rem,10vw,5.6rem); line-height:1.05; letter-spacing:-.03em; }
  .hero-title em{ font-style:italic; font-weight:200; background:linear-gradient(90deg,var(--gold),var(--gold-l)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero-sub{ margin-top:14px; color:var(--mute); font-size:.95rem; }
  .hero::after{ content:""; display:block; width:56px; height:1px; margin-top:36px; background:linear-gradient(90deg,var(--gold),transparent); }

  /* STAGE */
  .stage{
    margin-top:44px; padding:52px; border-radius:32px; display:flex; gap:56px; align-items:center; flex-wrap:wrap;
    background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.55));
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,.9); outline:1px solid var(--line); outline-offset:-1px;
    box-shadow:var(--shadow);
  }
  .turntable{ position:relative; width:200px; height:200px; flex-shrink:0; }
  .turntable::before{
    content:""; position:absolute; inset:-18px; border-radius:50%;
    background:radial-gradient(circle,#fff 55%,#f0eee9 100%);
    box-shadow:inset 0 2px 6px rgba(255,255,255,.9), 0 24px 40px -22px rgba(20,19,15,.28), 0 0 0 1px var(--line);
  }
  .vinyl{
    position:relative; width:200px; height:200px; border-radius:50%;
    background:
      conic-gradient(from 30deg,rgba(255,255,255,.0),rgba(255,255,255,.75) 12%,rgba(255,255,255,0) 25%,rgba(255,255,255,0) 50%,rgba(255,255,255,.75) 62%,rgba(255,255,255,0) 75%),
      repeating-radial-gradient(circle at center,#e9e7e1 0,#e9e7e1 1.5px,#dedbd3 1.5px,#dedbd3 3px);
    box-shadow:0 0 0 1px rgba(20,19,15,.12), inset 0 0 0 7px rgba(255,255,255,.55), 0 10px 20px -8px rgba(20,19,15,.3);
    display:flex; align-items:center; justify-content:center;
    animation:spin 8s linear infinite; animation-play-state:paused;
  }
  .vinyl.spinning{ animation-play-state:running; }
  .label{ width:84px; height:84px; border-radius:50%; position:relative; background:linear-gradient(145deg,#f1e6cf,var(--gold) 70%,#9c7d52); box-shadow:0 0 0 3px #fff, 0 0 0 4px rgba(20,19,15,.1), inset 0 1px 2px rgba(255,255,255,.6); }
  .label svg{ width:100%; height:100%; display:block; }
  .tonearm{ position:absolute; top:-18px; right:-34px; width:96px; height:96px; transform-origin:88px 8px; transform:rotate(-32deg); transition:transform .9s cubic-bezier(.4,0,.2,1); }
  .tonearm.down{ transform:rotate(-8deg); }
  .tonearm::before{ content:""; position:absolute; top:6px; right:6px; width:90px; height:3px; border-radius:3px; background:linear-gradient(90deg,#d9d6cd,#fff 40%,#8d897f); box-shadow:0 2px 4px rgba(20,19,15,.25); }
  .tonearm::after{ content:""; position:absolute; top:0; left:-2px; width:15px; height:13px; border-radius:4px; background:linear-gradient(145deg,var(--gold-l),var(--gold)); box-shadow:0 3px 6px rgba(20,19,15,.25); }

  .now-playing{ flex:1; min-width:230px; }
  .np-label{ font-size:.66rem; letter-spacing:.3em; color:var(--gold); margin-bottom:12px; text-transform:uppercase; }
  .np-title{ font-family:'Fraunces','Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif; font-weight:400; font-size:1.9rem; letter-spacing:-.015em; min-height:1.3em; }
  .np-artist{ color:var(--mute); font-size:.9rem; margin-bottom:26px; }
  .progress{ height:16px; display:flex; align-items:center; cursor:pointer; position:relative; }
  .progress::before{ content:""; position:absolute; left:0; right:0; height:3px; border-radius:3px; background:rgba(20,19,15,.07); box-shadow:inset 0 1px 1px rgba(20,19,15,.06); }
  .progress-fill{ position:relative; z-index:1; height:3px; width:0%; border-radius:3px; background:linear-gradient(90deg,var(--ink),var(--gold)); transition:width .2s linear; }
  .progress-fill::after{ content:""; position:absolute; right:-5px; top:-3.5px; width:10px; height:10px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(20,19,15,.15), 0 2px 5px rgba(20,19,15,.25); }
  .time-row{ display:flex; justify-content:space-between; font-size:.68rem; color:var(--mute); margin-top:4px; }

  .controls{ display:flex; align-items:center; justify-content:center; gap:22px; margin-top:24px; }
  .ctrl-btn{ border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); transition:transform .2s, box-shadow .3s, background .3s; }
  .ctrl-btn:active{ transform:scale(.93); }
  .ctrl-btn.skip{ width:42px; height:42px; border-radius:50%; font-size:1.05rem; background:#fff; box-shadow:0 0 0 1px var(--line), 0 6px 14px -6px rgba(20,19,15,.18); }
  .ctrl-btn.skip:hover{ box-shadow:0 0 0 1px var(--gold), 0 8px 18px -6px rgba(184,151,106,.4); }
  .ctrl-btn.main{ width:60px; height:60px; border-radius:50%; font-size:1.35rem; color:#fff; background:linear-gradient(160deg,#2d2b25,var(--ink)); box-shadow:0 12px 24px -8px rgba(20,19,15,.5), inset 0 1px 1px rgba(255,255,255,.18); }
  .ctrl-btn.main:hover{ box-shadow:0 14px 28px -8px rgba(184,151,106,.6), inset 0 1px 1px rgba(255,255,255,.25); }


  .ctrl-btn svg,.track-play svg{ width:1em; height:1em; display:block; }

  /* SETLIST */
  .section{ padding:88px 0 24px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; padding-bottom:18px; border-bottom:1px solid var(--line); }
  .section-title{ font-family:'Fraunces','Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif; font-weight:300; font-size:1.9rem; letter-spacing:-.01em; }
  .section-tag{ font-size:.68rem; letter-spacing:.22em; color:var(--gold); text-transform:uppercase; }
  .track{
    display:grid; grid-template-columns:40px 1fr auto 44px; align-items:center; gap:16px;
    padding:18px 20px; margin:2px -20px; border-radius:18px; cursor:pointer; border:1px solid transparent;
    transition:background .35s, box-shadow .35s, transform .35s;
  }
  .track:hover{ background:rgba(255,255,255,.6); }
  .track:focus-visible{ outline:1px solid var(--gold); outline-offset:2px; }
  .track.active{ background:#fff; border-color:var(--line); box-shadow:var(--shadow); transform:translateY(-1px); }
  .track-num{ font-size:.8rem; color:var(--mute); }
  .track.active .track-num{ color:var(--gold); }
  .track-info .t-title{ font-size:1.02rem; font-weight:500; }
  .track-info .t-desc{ font-size:.82rem; color:var(--mute); }
  .track-dur{ font-size:.78rem; color:var(--mute); }
  .track-play{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:.9rem; margin-left:auto; transition:all .3s; }
  .track:hover .track-play{ border-color:var(--gold); }
  .track.active .track-play{ background:linear-gradient(160deg,#2d2b25,var(--ink)); border-color:var(--ink); color:#fff; box-shadow:0 8px 16px -6px rgba(20,19,15,.45); }
  .hint{ margin-top:16px; font-size:.82rem; color:var(--mute); }

  footer{ margin-top:72px; border-top:1px solid var(--line); padding:28px 0 56px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; font-size:.66rem; letter-spacing:.2em; color:var(--mute); text-transform:uppercase; }

  @media (max-width:680px){
    header.hero{ padding-top:48px; }
    .stage{ padding:36px 26px; gap:44px; justify-content:center; }
    .track{ grid-template-columns:28px 1fr 44px; margin:2px -14px; padding:16px 14px; }
    .track-dur{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){
    body{ animation:none; }
    .vinyl{ animation:none; }
    .vinyl.spinning{ transform:rotate(8deg); }
    .marquee .dot{ animation:none; }
    .tonearm{ transition:none; }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ===== 紧凑吸顶播放器：控制键始终在屏幕上方 ===== */
  header.hero{ padding:36px 0 0; }
  .marquee{ margin-bottom:22px; }
  .hero-title{ font-size:clamp(2rem,8vw,2.8rem); }
  .hero-title br,.hero-sub{ display:none; }
  .hero-title em{ margin-left:.15em; }
  .hero::after{ margin-top:18px; }
  .stage{ position:sticky; top:10px; z-index:20; margin-top:20px; padding:14px 18px 16px; gap:0 16px; border-radius:26px; display:grid; grid-template-columns:76px 1fr; align-items:center; text-align:left; justify-content:normal; }
  .now-playing{ display:contents; }
  .np-label,.tonearm{ display:none; }
  .turntable{ width:76px; height:76px; grid-column:1; grid-row:1 / 3; }
  .turntable::before{ inset:-4px; box-shadow:0 8px 16px -8px rgba(20,19,15,.3), 0 0 0 1px var(--line); }
  .vinyl{ width:76px; height:76px; box-shadow:0 0 0 1px rgba(20,19,15,.12), inset 0 0 0 3px rgba(255,255,255,.55); }
  .label{ width:34px; height:34px; box-shadow:0 0 0 2px #fff, 0 0 0 3px rgba(20,19,15,.1); }
  .np-title{ grid-column:2; grid-row:1; align-self:end; min-width:0; min-height:0; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np-artist{ grid-column:2; grid-row:2; align-self:start; margin:2px 0 0; font-size:.8rem; }
  .progress{ grid-column:1 / -1; grid-row:3; margin-top:14px; }
  .time-row{ grid-column:1 / -1; grid-row:4; }
  .controls{ grid-column:1 / -1; grid-row:5; margin-top:8px; gap:20px; }
  .ctrl-btn.skip{ width:40px; height:40px; }
  .ctrl-btn.main{ width:52px; height:52px; }
  .section{ padding:36px 0 16px; }
  footer{ margin-top:24px; padding:18px 0 40px; flex-wrap:nowrap; gap:16px; font-size:.58rem; letter-spacing:.16em; }
  footer span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ===== 我的收藏：横向网格，不滑动 ===== */
  .coll-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  @media (min-width:680px){ .coll-grid{ grid-template-columns:repeat(4,1fr); } }
  .coll{ display:block; width:100%; font:inherit; color:inherit; text-align:left; cursor:pointer; padding:10px 10px 14px; border-radius:22px; background:var(--glass); border:1px solid #fff; outline:1px solid var(--line); outline-offset:-1px; box-shadow:var(--shadow); transition:transform .35s, outline-color .35s; }
  .coll:hover{ transform:translateY(-2px); }
  .coll.open{ outline-color:var(--gold); }
  .cover{ display:block; position:relative; aspect-ratio:1/1; border-radius:16px; overflow:hidden; background:linear-gradient(145deg,#f6ecd9,#e3d3b4); }
  .coll:nth-child(2) .cover{ background:linear-gradient(145deg,#f3f1ec,#d9d6cd); }
  .coll:nth-child(3) .cover{ background:linear-gradient(145deg,#f7efe8,#e6d6cb); }
  .coll:nth-child(4) .cover{ background:linear-gradient(145deg,#f1f2ef,#d6dbd5); }
  .cover::before{ content:""; position:absolute; left:50%; top:50%; width:68%; aspect-ratio:1/1; transform:translate(-50%,-50%); border-radius:50%; background:repeating-radial-gradient(circle,rgba(255,255,255,.6) 0 1.5px,rgba(255,255,255,.2) 1.5px 3px); box-shadow:0 8px 16px -8px rgba(20,19,15,.3); }
  .cover::after{ content:""; position:absolute; left:50%; top:50%; width:16%; aspect-ratio:1/1; transform:translate(-50%,-50%); border-radius:50%; background:linear-gradient(145deg,#f1e6cf,var(--gold)); box-shadow:0 0 0 2px #fff; }
  .c-name{ display:block; margin:12px 4px 0; font-family:'Fraunces','Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif; font-size:1rem; }
  .c-count{ display:block; margin:0 4px; font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-weight:300; font-size:.66rem; letter-spacing:.2em; color:var(--mute); }
  .coll-panel{ margin-top:28px; scroll-margin-top:270px; animation:fade .5s ease both; }
  .coll-panel[hidden]{ display:none; }
  .panel-head{ display:flex; align-items:baseline; justify-content:space-between; padding-bottom:14px; margin-bottom:10px; border-bottom:1px solid var(--line); }
  .panel-title{ font-family:'Fraunces','Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif; font-size:1.3rem; }
  .panel-close{ background:none; border:none; cursor:pointer; font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-weight:300; font-size:.68rem; letter-spacing:.2em; color:var(--gold); }
  .empty{ padding:28px 0; text-align:center; color:var(--mute); font-size:.85rem; }
  .coll-panel:has(.track) .empty{ display:none; }

  /* ===== 收藏子页面 ===== */
  .coll-panel{ margin-top:8px; animation:reveal .8s cubic-bezier(.25,.1,.25,1) both; }
  .panel-head{ flex-direction:column; align-items:flex-start; gap:14px; padding-bottom:20px; margin-bottom:6px; }
  .panel-close{ font-size:.78rem; padding:6px 0; color:var(--ink); }
  .panel-line{ display:flex; align-items:baseline; gap:14px; }
  .panel-title{ font-size:2rem; font-weight:300; letter-spacing:-.01em; }
  .panel-count{ font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-weight:300; font-size:.7rem; letter-spacing:.2em; color:var(--gold); }
  body.in-coll header.hero,
  body.in-coll #collections > .section-head,
  body.in-coll .home-tools,
  body.in-coll #searchRes,
  body.in-coll .coll-grid{ display:none; }
  body.in-coll .stage{ margin-top:16px; }

  /* ===== 慢慢显现 ===== */
  @keyframes reveal{ from{ opacity:0; filter:blur(6px); } to{ opacity:1; filter:blur(0); } }
  header.hero,
  #collections > .section-head,
  .coll-grid{ animation:reveal .8s cubic-bezier(.25,.1,.25,1) both; }
  .coll-panel .panel-head{ animation:reveal .8s cubic-bezier(.25,.1,.25,1) both; }
  .coll-panel .track{ animation:reveal .8s cubic-bezier(.25,.1,.25,1) both; }
  .coll-panel .track:nth-of-type(2){ animation-delay:0.08s; }
  .coll-panel .track:nth-of-type(3){ animation-delay:0.15s; }
  .coll-panel .track:nth-of-type(4){ animation-delay:0.21s; }
  .coll-panel .track:nth-of-type(5){ animation-delay:0.28s; }
  .coll-panel .track:nth-of-type(6){ animation-delay:0.34s; }
  .coll-panel .track:nth-of-type(7){ animation-delay:0.41s; }
  .coll-panel .track:nth-of-type(8){ animation-delay:0.47s; }
  @media (prefers-reduced-motion:reduce){
    header.hero,#collections > .section-head,.coll-grid,.coll-panel,.coll-panel .panel-head,.coll-panel .track{ animation:none; }
  }

  /* ===== 深色模式 ===== */
  :root{ --card:#fff; }
  .theme-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1rem; transition:border-color .3s, transform .2s; }
  .theme-btn:hover{ border-color:var(--gold); }
  .theme-btn:active{ transform:scale(.92); }
  .theme-btn svg{ width:1em; height:1em; display:block; }
  html.theme-anim *{ transition:background-color .45s, border-color .45s, color .45s, box-shadow .45s !important; }

  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e0e0c; --ink:#f3f1ea; --soft:#c9c6bc; --mute:#8a877e; --line:rgba(255,255,255,.09);
    --gold:#c9a97a; --gold-l:#e8d8b8; --glass:rgba(32,31,27,.72); --card:#1c1b18;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -12px rgba(0,0,0,.6),0 40px 80px -40px rgba(0,0,0,.7);
  }
  html[data-theme="dark"] body{
    background:
      radial-gradient(60% 40% at 15% 0%, rgba(255,255,255,.06) 0%, transparent 70%),
      radial-gradient(50% 40% at 90% 20%, rgba(201,169,122,.14) 0%, transparent 70%),
      radial-gradient(60% 50% at 50% 100%, rgba(255,255,255,.04) 0%, transparent 70%),
      var(--bg);
    background-attachment:fixed;
  }
  html[data-theme="dark"] .stage{ background:linear-gradient(145deg,rgba(42,41,36,.92),rgba(26,25,22,.72)); border-color:rgba(255,255,255,.08); }
  html[data-theme="dark"] .turntable::before{ background:radial-gradient(circle,#26241f 55%,#1a1915 100%); box-shadow:inset 0 2px 6px rgba(255,255,255,.05),0 8px 16px -8px rgba(0,0,0,.7),0 0 0 1px var(--line); }
  html[data-theme="dark"] .vinyl{
    background:
      conic-gradient(from 30deg,transparent,rgba(255,255,255,.14) 12%,transparent 25%,transparent 50%,rgba(255,255,255,.14) 62%,transparent 75%),
      repeating-radial-gradient(circle at center,#1f1e1a 0,#1f1e1a 1.5px,#151411 1.5px,#151411 3px);
    box-shadow:0 0 0 1px rgba(255,255,255,.1), inset 0 0 0 3px rgba(255,255,255,.06);
  }
  html[data-theme="dark"] .label{ box-shadow:0 0 0 2px #1c1b18, 0 0 0 3px rgba(255,255,255,.12); }
  html[data-theme="dark"] .progress::before{ background:rgba(255,255,255,.12); box-shadow:none; }
  html[data-theme="dark"] .ctrl-btn.skip{ background:var(--card); box-shadow:0 0 0 1px var(--line), 0 6px 14px -6px rgba(0,0,0,.6); }
  html[data-theme="dark"] .ctrl-btn.main,
  html[data-theme="dark"] .track.active .track-play{ background:linear-gradient(160deg,#f6f3ea,#d9d4c6); color:#14130f; border-color:transparent; box-shadow:0 10px 22px -8px rgba(201,169,122,.45), inset 0 1px 1px rgba(255,255,255,.6); }
  html[data-theme="dark"] .track:hover{ background:rgba(255,255,255,.05); }
  html[data-theme="dark"] .track.active{ background:var(--card); }
  html[data-theme="dark"] .track-play{ background:var(--card); }
  html[data-theme="dark"] .coll{ border-color:rgba(255,255,255,.08); }
  html[data-theme="dark"] .cover{ background:linear-gradient(145deg,#3b352a,#2a2620); }
  html[data-theme="dark"] .coll:nth-child(2) .cover{ background:linear-gradient(145deg,#35342f,#252421); }
  html[data-theme="dark"] .coll:nth-child(3) .cover{ background:linear-gradient(145deg,#38312d,#272220); }
  html[data-theme="dark"] .coll:nth-child(4) .cover{ background:linear-gradient(145deg,#2f322f,#222522); }
  html[data-theme="dark"] .cover::before{ background:repeating-radial-gradient(circle,rgba(255,255,255,.12) 0 1.5px,rgba(255,255,255,.04) 1.5px 3px); box-shadow:0 8px 16px -8px rgba(0,0,0,.6); }
  html[data-theme="dark"] .cover::after{ box-shadow:0 0 0 2px #1c1b18; }

  /* =====================================================
     新增功能样式
     ===================================================== */

  /* 提示条 */
  .toast{ position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px); z-index:100; max-width:86vw; padding:8px 18px; border-radius:22px; font-size:.8rem; text-align:center; background:var(--ink); color:var(--bg); opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; box-shadow:var(--shadow); }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* 封面图（替换黑胶中心贴纸） */
  .label-img{ position:absolute; inset:0; width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .vinyl.has-cover .label{ width:46px; height:46px; }

  /* 歌词 */
  .lyric{ grid-column:1 / -1; grid-row:3; margin-top:10px; text-align:center; overflow:hidden; }
  .ly-cur{ font-family:'Fraunces','Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif; font-size:.95rem; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ly-cur.swap{ animation:lyin .45s ease both; }
  @keyframes lyin{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  .ly-next{ display:none; margin-top:2px; font-size:.75rem; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stage.expanded .ly-next{ display:block; }

  /* 频谱 */
  .viz{ grid-column:1 / -1; grid-row:4; display:block; width:100%; height:20px; margin-top:10px; }
  .progress{ grid-row:5; margin-top:6px; height:22px; touch-action:none; }
  .time-row{ grid-row:6; }
  .controls{ grid-row:7; gap:14px; }

  /* 播放器小按钮（模式 / 收藏） */
  .ctrl-btn.mini{ width:36px; height:36px; border-radius:50%; background:none; color:var(--mute); }
  .ctrl-btn.mini svg{ width:19px; height:19px; }
  .ctrl-btn.mini:hover{ color:var(--ink); }
  .ctrl-btn.mini.on{ color:var(--gold); }
  .heart-ico{ fill:none; stroke:currentColor; }
  .on > .heart-ico{ fill:currentColor; }

  /* 展开更多 */
  .more-toggle{ position:absolute; top:12px; right:14px; width:30px; height:30px; border:none; border-radius:50%; background:none; color:var(--mute); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.1rem; transition:color .3s; }
  .more-toggle:hover,.stage.expanded .more-toggle{ color:var(--gold); }
  .more-toggle svg{ width:1em; height:1em; display:block; }
  .np-title,.np-artist{ padding-right:34px; }
  .more{ grid-column:1 / -1; grid-row:8; display:none; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 12px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .stage.expanded .more{ display:flex; }
  .chip{ font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-weight:300; font-size:.7rem; display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; transition:border-color .3s, color .3s; }
  .chip:hover{ border-color:var(--gold); }
  .chip.on{ border-color:var(--gold); color:var(--gold); }
  .chip svg{ width:13px; height:13px; display:block; }

  /* 首页：搜索 + 随便听听 */
  .home-tools{ display:flex; gap:10px; align-items:center; margin:16px 0 0; }
  body.searching #collections > .section-head{ display:none; }
  .search,.sort{ font:inherit; font-size:.85rem; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:8px 16px; outline:none; transition:border-color .3s; }
  .search{ flex:1; min-width:0; -webkit-appearance:none; appearance:none; }
  .search:focus,.sort:focus{ border-color:var(--gold); }
  .sort{ font-size:.78rem; padding:8px 12px; cursor:pointer; }
  .chip.lucky{ padding:8px 16px; font-size:.74rem; white-space:nowrap; }
  body.searching .coll-grid{ display:none; }
  .panel-tools{ display:flex; gap:10px; width:100%; }

  /* 歌曲行：加入收藏心 */
  .track{ grid-template-columns:40px 1fr auto 34px 44px; gap:12px; }
  .track-fav{ width:34px; height:34px; border:none; border-radius:50%; background:none; color:var(--mute); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.05rem; transition:color .3s, transform .2s; }
  .track-fav svg{ width:1em; height:1em; display:block; }
  .track-fav:hover,.track-fav.on{ color:var(--gold); }
  .track-fav:active{ transform:scale(.82); }
  .track.sortable .track-num{ cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  .track.dragging{ position:relative; z-index:5; background:var(--card); box-shadow:var(--shadow); transition:none; cursor:grabbing; }
  .track.drop-before{ box-shadow:0 -2px 0 var(--gold); }
  .track.drop-after{ box-shadow:0 2px 0 var(--gold); }
  .track.flash{ animation:flash 1.8s ease; }
  @keyframes flash{ 0%,100%{ background:transparent; } 30%{ background:rgba(184,151,106,.28); } }
  .tracks.quiet .track{ animation:none; }
  @media (min-width:680px){ .coll-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:680px){
    .track{ grid-template-columns:28px 1fr 34px 44px; }
  }
  @media (prefers-reduced-motion:reduce){ .ly-cur.swap,.track.flash{ animation:none; } }

  /* 完整歌词页 */
  .lyric{ cursor:pointer; }
  .lyr-full{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; padding:18px 28px 22px; background:var(--bg); animation:fade .3s ease both; }
  .lyr-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:860px; width:100%; margin:0 auto; }
  .lyr-name{ font-family:'Fraunces','Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif; font-size:1.1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lyr-close{ width:36px; height:36px; border:1px solid var(--line); border-radius:50%; background:var(--card); color:var(--ink); font-size:1.2rem; line-height:1; cursor:pointer; flex-shrink:0; }
  .lyr-list{ position:relative; flex:1; overflow-y:auto; text-align:center; padding:35vh 0; max-width:860px; width:100%; margin:0 auto; scrollbar-width:none; }
  .lyr-list::-webkit-scrollbar{ display:none; }
  .lyr-line{ padding:8px 0; color:var(--mute); font-family:'Fraunces','Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif; font-size:1.05rem; cursor:pointer; transition:color .3s, font-size .3s; }
  .lyr-line:hover{ color:var(--soft); }
  .lyr-line.cur{ color:var(--ink); font-size:1.3rem; }
  .lyr-empty{ margin-top:30vh; color:var(--mute); font-size:.9rem; }
  .lyr-ctrl{ display:flex; align-items:center; justify-content:center; gap:22px; padding-top:10px; }
  .lyr-ctrl .ctrl-btn.skip{ width:40px; height:40px; }
  .lyr-ctrl .ctrl-btn.main{ width:52px; height:52px; }
  html[data-theme="dark"] .lyr-ctrl .ctrl-btn.skip{ background:var(--card); }
  @media (max-width:680px){
    .viz{ display:none; }
    .stage.expanded .viz{ display:block; }
  }
</style>
</head>

<script>
  /* ================= 基础工具 ================= */
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const pad2 = n => String(n).padStart(2, '0');
  const artistName = a => (a || '').replace(/^歌手\s*[:：]\s*/, '');
  function formatTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }
  const LS = {
    get(k, d){ try { const v = localStorage.getItem('mh_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v){ try { localStorage.setItem('mh_' + k, JSON.stringify(v)); } catch (e) {} }
  };
  let toastTimer = 0;
  function toast(msg){
    const el = $('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1900);

  /* ================= 元素 ================= */

  const btnMode = $('btnMode'), btnFav = $('btnFav'), moreBtn = $('moreBtn');
  const player = $('player');
  const lyricEl = $('lyric'), lyCur = $('lyCur'), lyNext = $('lyNext'), labelImg = $('labelImg');
  const vizC = $('viz');
  const lyrFull = $('lyrFull'), lyrList = $('lyrList'), lyrName = $('lyrName'), lyrClose = $('lyrClose'), lyrPrev = $('lyrPrev'), lyrPlay = $('lyrPlay'), lyrNext = $('lyrNext');

  /* ================= 图标 ================= */
  const svg = d => '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + d + '</svg>';

  const ICON_PLAY  = svg('<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>');

  const ICON_PREV  = svg('<path d="M6 5h2v14H6zM19 5.9v12.2a.8.8 0 0 1-1.25.66L9.5 12.66a.8.8 0 0 1 0-1.32l8.25-6.1A.8.8 0 0 1 19 5.9z"/>');
  const ICON_NEXT  = svg('<path d="M16 5h2v14h-2zM5 5.9v12.2a.8.8 0 0 0 1.25.66l8.25-6.1a.8.8 0 0 0 0-1.32l-8.25-6.1A.8.8 0 0 0 5 5.9z"/>');

  /* ================= 曲库 / 歌单数据 ================= */
  const lib = {};
  let libOrder = [];
  document.querySelectorAll('#list-p0 .track').forEach(el => {
    const d = el.dataset, id = d.id || d.title;

  // 兼容旧数据：以前用歌名当标识，这里自动换成 data-id
  const titleMap = {};
  Object.keys(lib).forEach(id => { if (!(lib[id].title in titleMap)) titleMap[lib[id].title] = id; });
  const fixId = x => lib[x] ? x : (titleMap[x] || x);
  const uniq = arr => Array.from(new Set(arr.map(fixId))).filter(id => lib[id]);

  let recent = uniq(LS.get('recent', []) || []);
  let plays = {};

  const inlineLrc = {};

  const panelDefs = {

    p1: { get: () => favs,     set: v => { favs = v;     LS.set('fav', v); },   sortable: true,  empty: '还没有收藏，点歌曲右侧的 ♥ 添加' },
    p2: { get: () => recent.slice().sort((a, b) => (plays[b] || 0) - (plays[a] || 0) || recent.indexOf(a) - recent.indexOf(b)),   set: null,                                       sortable: false, empty: '还没有播放记录，听几首歌就会出现在这里' }
  };
  const view = { p0: { q: '', sort: 'default' }, p1: { q: '', sort: 'default' }, p2: { q: '', sort: 'default' } };
  const cmp = {

    artist: (a, b) => artistName(lib[a].artist).localeCompare(artistName(lib[b].artist), 'zh'),
    dur:    (a, b) => lib[a].dur - lib[b].dur

  const matchQ = (id, q) => (lib[id].title + ' ' + lib[id].artist).toLowerCase().includes(q);

  /* ---------- 渲染歌曲行 ---------- */
  function buildTrack(id, n, sortable, withPlays){

  function renderTracks(cont, ids, sortable, quiet, withPlays){

  function renderPanel(pid, quiet){

  }
  function syncTrackUI(){
    document.querySelectorAll('.track').forEach(t => {

      t.classList.toggle('active', on);

  function updateCounts(){
    document.querySelectorAll('.coll').forEach(card => {

  /* ---------- 收藏 / 最近 ---------- */
  function toggleFav(id){
    if (!lib[id]) return;

    else { favs.push(id); toast('已加入「我的最爱」'); }

    syncTrackUI(); updateCounts();
  }
  function recordRecent(id){
    plays[id] = (plays[id] || 0) + 1; LS.set('plays', plays);

    recent = [id].concat(recent.filter(x => x !== id)).slice(0, 20);
    LS.set('recent', recent); updateCounts();
  }

  /* ================= 歌词 ================= */
  let lyLines = [], lyIdx = -2, lyToken = 0;
  function parseLrc(text){
    const out = []; let offset = 0;
    text.split(/\r?\n/).forEach(line => {
      const off = line.match(/^\[offset:\s*(-?\d+)\]/i);
      if (off) { offset = parseInt(off[1], 10) / 1000; return; }
      const tags = Array.from(line.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g));
      if (!tags.length) return;
      const txt = line.replace(/\[[^\]]*\]/g, '').trim();
      tags.forEach(m => out.push({ t: parseInt(m[1], 10) * 60 + parseFloat(m[2].replace(':', '.')), text: txt }));
    });
    out.forEach(l => { l.t -= offset; });
    out.sort((a, b) => a.t - b.t);
    return out;
  }
  async function loadLyrics(m){
    const token = ++lyToken;
    lyLines = []; lyIdx = -2; lyricEl.hidden = true; lyCur.textContent = ''; lyNext.textContent = '';
    if (!lyrFull.hidden) renderFull();
    let text = inlineLrc[m.id] != null ? inlineLrc[m.id] : null;
    if (text == null) {
      const url = m.lrc || (m.src ? m.src.replace(/\.\w+$/, '.lrc') : '');
      if (!url) return;
      try { const r = await fetch(url); if (!r.ok) return; text = await r.text(); } catch (e) { return; }
    }
    if (token !== lyToken) return;
    const lines = parseLrc(text);
    if (!lines.length) return;
    lyLines = lines; lyricEl.hidden = false;
    if (!lyrFull.hidden) renderFull();
    updateLyric(curTime());
  }
  function updateLyric(t){
    if (!lyLines.length) return;
    let lo = 0, hi = lyLines.length - 1, idx = -1; t += 0.2;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (lyLines[mid].t <= t) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
    if (idx === lyIdx) return;
    lyIdx = idx;
    lyCur.textContent = idx >= 0 ? (lyLines[idx].text || '♪') : '♪';
    lyNext.textContent = (lyLines[idx + 1] && lyLines[idx + 1].text) || '';
    lyCur.classList.remove('swap'); void lyCur.offsetWidth; lyCur.classList.add('swap');
    if (!lyrFull.hidden) syncFull(true);
  }
  // 完整歌词页：点播放器里的歌词行打开，点某一句可跳转
  let lyrCurEl = null;
  function renderFull(){
    lyrName.textContent = (curId && lib[curId]) ? lib[curId].title : '';
    lyrCurEl = null;
    if (!lyLines.length) { lyrList.innerHTML = '<p class="lyr-empty">这首歌暂无歌词</p>'; return; }
    lyrList.replaceChildren(...lyLines.map((l, i) => {
      const d = document.createElement('div'); d.className = 'lyr-line'; d.dataset.i = i; d.textContent = l.text || '♪'; return d;
    }));
    syncFull(false);
  }
  function syncFull(smooth){
    if (lyrCurEl) lyrCurEl.classList.remove('cur');
    const el = lyIdx >= 0 ? lyrList.children[lyIdx] : null;
    lyrCurEl = el || null;
    if (!el) return;
    el.classList.add('cur');
    lyrList.scrollTo({ top: el.offsetTop - lyrList.clientHeight / 2 + el.offsetHeight / 2, behavior: smooth ? 'smooth' : 'auto' });
  }
  function closeLyrics(){ lyrFull.hidden = true; document.body.style.overflow = ''; }
  lyricEl.addEventListener('click', () => {
    if (!lyLines.length) return;
    lyrFull.hidden = false; document.body.style.overflow = 'hidden';
    renderFull();
  });
  lyrClose.addEventListener('click', closeLyrics);
  lyrList.addEventListener('click', e => { const d = e.target.closest('.lyr-line'); if (d) seekTo(lyLines[+d.dataset.i].t); });
  lyrPlay.addEventListener('click', () => togglePlay());
  lyrPrev.addEventListener('click', () => go(-1, true));
  lyrNext.addEventListener('click', () => go(1, true));

  /* ================= 音频上下文 / 频谱 ================= */
  function getCtx(){
    if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
    return audioCtx;
  }
  function resumeCtx(){ if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  // 仅在 http(s) 且音频同源时接入分析器（file:// 下接入会让声音静音，所以改用模拟频谱）
  function ensureAnalyser(){
    if (ctxHooked) { resumeCtx(); return; }
    ctxHooked = true;
    try {
      if (!/^https?:$/.test(location.protocol)) return;
      const sameOrigin = Object.keys(lib).every(k => !lib[k].src || new URL(lib[k].src, location.href).origin === location.origin);
      if (!sameOrigin) return;
      const ctx = getCtx(); if (!ctx) return;
      const node = ctx.createMediaElementSource(player);
      const an = ctx.createAnalyser(); an.fftSize = 128; an.smoothingTimeConstant = 0.75;
      node.connect(an); an.connect(ctx.destination);
      analyser = an; vizData = new Uint8Array(an.frequencyBinCount);
    } catch (e) { analyser = null; }
    resumeCtx();
  }

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const vctx = vizC.getContext('2d');
  const BARS = 44;
  const levels = new Float32Array(BARS);
  let vizRAF = 0, vizColor = '#b8976a';
  function refreshVizColor(){ vizColor = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim() || '#b8976a'; }
  function sizeViz(){
    const r = vizC.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    vizC.width = Math.max(1, Math.round(r.width * d)); vizC.height = Math.max(1, Math.round(r.height * d));
    startViz();
  }
  function vizFrame(ts){
    vizRAF = 0;
    const W = vizC.width, H = vizC.height, d = window.devicePixelRatio || 1;
    vctx.clearRect(0, 0, W, H);
    let alive = false;
    const gap = W / BARS, lw = Math.max(1, 1.5 * d);
    vctx.fillStyle = vizColor;
    for (let i = 0; i < BARS; i++) {
      let target = 0;
      if (isPlaying && !reduceMotion) {
        if (analyser) {
          analyser.getByteFrequencyData(vizData);
          target = vizData[Math.floor(i / BARS * vizData.length * 0.7)] / 255;
        } else {
          target = 0.2 + 0.8 * Math.abs(Math.sin(ts * 0.0021 * (0.6 + (i % 7) * 0.11) + i * 0.9) * Math.cos(ts * 0.0013 + i * 0.37));
        }
      }
      levels[i] += (target - levels[i]) * (target > levels[i] ? 0.5 : 0.12);
      if (levels[i] > 0.01) alive = true;
      const h = Math.max(2 * d, levels[i] * H), x = i * gap + gap / 2;
      vctx.globalAlpha = 0.3 + 0.7 * levels[i];
      vctx.fillRect(x - lw / 2, (H - h) / 2, lw, h);
    }
    vctx.globalAlpha = 1;
    if (isPlaying || alive) vizRAF = requestAnimationFrame(vizFrame);
  }
  function startViz(){ if (!vizRAF) vizRAF = requestAnimationFrame(vizFrame); }

  /* ================= 模拟音（无音频文件时） ================= */
  const motifs = {
    "12.31": [392, 466.16, 523.25, 587.33],
    "玻璃": [523.25, 392, 659.25, 392],
    "与火星的孩子对话": [349.23, 440, 523.25],
    "谁": [293.66, 349.23, 440, 349.23],
    "爱错": [659.25, 587.33, 523.25, 659.25, 783.99],
    "病态的爱": [220, 261.63, 246.94, 220]
  };
  function playMotif(title){
    const ctx = getCtx(); if (!ctx) return;
    resumeCtx();
    const notes = motifs[title] || [440], noteLen = 0.22, peak = 0.12;
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = ctx.currentTime + i * noteLen;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(peak, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + noteLen);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + noteLen);
    });
  }
  function clearSim(){ if (simTimer) { clearInterval(simTimer); simTimer = null; } }
  function startSim(){
    clearSim();
    simTimer = setInterval(() => {
      simElapsed += playbackRate;
      if (!seeking) showPos(Math.min(simElapsed, simDur));
      if (Date.now() - lastSave > 1500) { lastSave = Date.now(); saveState(); }
      if (simElapsed >= simDur) onTrackEnded();
    }, 1000);
  }

  /* ================= 播放核心 ================= */
  function showPos(sec){
    const d = totalDur() || 1;
    progressFill.style.width = clamp(sec / d * 100, 0, 100) + '%';
    timeNow.textContent = formatTime(sec);
    updateLyric(sec);
  }
  function stopAll(){
    player.pause();
    player.ontimeupdate = null; player.onended = null; player.onerror = null; player.onloadedmetadata = null;
    clearSim();
  }
  function setCover(m){
    if (m.cover) { labelImg.src = m.cover; labelImg.hidden = false; vinyl.classList.add('has-cover'); }
    else { labelImg.hidden = true; labelImg.removeAttribute('src'); vinyl.classList.remove('has-cover'); }
  }
  labelImg.addEventListener('error', () => { labelImg.hidden = true; vinyl.classList.remove('has-cover'); });

  function refreshPlayUI(){
    vinyl.classList.toggle('spinning', isPlaying);
    tonearm.classList.toggle('down', isPlaying);
    btnPlay.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
    lyrPlay.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
    syncTrackUI();
    document.title = (isPlaying && curId) ? '▶ ' + lib[curId].title + ' · 音乐馆' : '音乐馆';
    if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused'; } catch (e) {} }
    if (isPlaying) startViz();
  }
  function safePlay(){
    const p = player.play();
    if (p && p.catch) p.catch(err => { if (err && err.name !== 'AbortError') { isPlaying = false; refreshPlayUI(); if (err.name === 'NotAllowedError') toast('浏览器拦截了自动播放，请点一下播放键'); } });
  }
  function onAudioError(){
    if (!isSrcMode || !curId) return;
    toast('找不到音频文件：' + lib[curId].src);
    isPlaying = false; refreshPlayUI();
  }
  function onMeta(){
    if (pendingSeek > 0 && isFinite(player.duration)) player.currentTime = Math.min(pendingSeek, Math.max(0, player.duration - 0.5));
    pendingSeek = 0;
    if (isFinite(player.duration)) { timeTotal.textContent = formatTime(player.duration); setDur(curId, player.duration); }
  }
  function setDur(id, d){
    if (!lib[id] || !isFinite(d) || d <= 0) return;
    d = Math.round(d);
    if (lib[id].dur === d) return;
    lib[id].dur = d;
    document.querySelectorAll('.track').forEach(t => {
      if (t.dataset.id !== id) return;
      const el = t.querySelector('.track-dur'); if (el) el.textContent = formatTime(d);
    });
    if (id === curId) timeTotal.textContent = formatTime(d);
  }
  // 页面加载后依次读取每首歌的真实时长，修正 data-dur 的误差
  function probeDurations(){
    const ids = Object.keys(lib).filter(id => lib[id].src); let i = 0;
    const next = () => {
      if (i >= ids.length) return;
      const id = ids[i++], a = new Audio(); a.preload = 'metadata';
      const done = () => { a.onloadedmetadata = a.onerror = null; a.removeAttribute('src'); next(); };
      a.onloadedmetadata = () => { setDur(id, a.duration); done(); };
      a.onerror = done;
      a.src = lib[id].src;
    };
    next();
  }
  window.addEventListener('load', () => setTimeout(probeDurations, 600));
  function onTime(){
    if (seeking || pendingSeek > 0) return;
    showPos(player.currentTime);
    const now = Date.now();
    if (now - lastSave > 1500) { lastSave = now; saveState(); updatePosition(); }
  }
  function loadTrack(id, autoPlay, seek){
    const m = lib[id]; if (!m) return;
    stopAll();
    curId = id; pendingSeek = seek || 0;
    npTitle.textContent = m.title; npArtist.textContent = m.artist;
    timeTotal.textContent = formatTime(m.dur);
    progressFill.style.width = '0%'; timeNow.textContent = '0:00';
    setCover(m); updateMedia(m); loadLyrics(m);
    isSrcMode = !!m.src;
    if (isSrcMode) {
      player.src = m.src;
      player.defaultPlaybackRate = playbackRate; player.playbackRate = playbackRate;
      player.ontimeupdate = onTime; player.onended = onTrackEnded; player.onerror = onAudioError; player.onloadedmetadata = onMeta;
      if (autoPlay) { ensureAnalyser(); resumeCtx(); safePlay(); }
    } else {
      simElapsed = seek || 0; simDur = m.dur;
      if (autoPlay) { playMotif(m.title); startSim(); }
    }
    if (seek) showPos(seek);
    isPlaying = !!autoPlay;
    if (autoPlay) recordRecent(id);
    refreshPlayUI(); saveState();
  }
  function startQueue(ids, src, id){ queue = ids.slice(); queueSrc = src; shuffleHist = []; loadTrack(id, true); }
  function pauseNow(){
    if (isSrcMode) player.pause(); else clearSim();
    isPlaying = false; refreshPlayUI(); saveState();
  }
  function resumeNow(){
    if (isSrcMode) { ensureAnalyser(); resumeCtx(); safePlay(); } else startSim();
    isPlaying = true; refreshPlayUI();
  }
  function togglePlay(){
    if (!curId) { if (libOrder.length) startQueue(libOrder, 'p0', libOrder[0]); return; }
    if (isPlaying) pauseNow(); else resumeNow();
  }

  function pickNext(dir, manual){
    if (!queue.length) return null;
    const i = queue.indexOf(curId);
    if (mode === 'shuffle' && queue.length > 1) {
      if (dir < 0) {
        while (shuffleHist.length) { const p = shuffleHist.pop(); if (p !== curId && queue.includes(p)) return p; }
        return queue[i <= 0 ? queue.length - 1 : i - 1];
      }
      let r; do { r = queue[Math.floor(Math.random() * queue.length)]; } while (r === curId);
      return r;
    }
    if (dir > 0) { if (i >= queue.length - 1) return manual ? queue[0] : null; return queue[i + 1]; }
    return queue[i <= 0 ? queue.length - 1 : i - 1];
  }
  function go(dir, manual){
    if (!curId || !queue.length) { if (libOrder.length) startQueue(libOrder, 'p0', libOrder[0]); return true; }
    const n = pickNext(dir, manual); if (n == null) return false;
    if (mode === 'shuffle' && dir > 0) shuffleHist.push(curId);
    loadTrack(n, true); return true;
  }
  function onTrackEnded(){
    if (mode === 'one') {
      if (isSrcMode) { player.currentTime = 0; safePlay(); }
      else { simElapsed = 0; playMotif(lib[curId].title); }
      return;
    }
    stopAll();
    if (!go(1, false)) {
      isPlaying = false; curId = null;
      npTitle.textContent = '— 播放结束 —'; npArtist.textContent = '已播完全部曲目';
      progressFill.style.width = '0%'; timeNow.textContent = '0:00'; lyricEl.hidden = true;
      refreshPlayUI();
    }
  }

  /* ---------- 进度 / 跳转 ---------- */
  function seekTo(sec){
    if (!curId) return;
    sec = clamp(sec, 0, Math.max(0, totalDur() - 0.3));
    if (isSrcMode) { if (player.readyState > 0 && isFinite(player.duration)) player.currentTime = sec; else pendingSeek = sec; }
    else simElapsed = Math.floor(sec);
    showPos(sec);
  }
  const seekBy = s => { if (curId) seekTo(curTime() + s); };
  const ratioOf = e => { const r = progressBar.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); };
  progressBar.addEventListener('pointerdown', e => {
    if (!curId) return;
    seeking = true;
    try { progressBar.setPointerCapture(e.pointerId); } catch (err) {}
    showPos(ratioOf(e) * totalDur());
  });
  progressBar.addEventListener('pointermove', e => { if (seeking) showPos(ratioOf(e) * totalDur()); });
  progressBar.addEventListener('pointerup', e => { if (!seeking) return; seeking = false; seekTo(ratioOf(e) * totalDur()); });
  progressBar.addEventListener('pointercancel', () => { seeking = false; });

  /* ---------- 状态记忆 ---------- */
  function saveState(){
    if (!curId) return;
    LS.set('state', { id: curId, t: Math.floor(pendingSeek > 0 ? pendingSeek : curTime()), qp: queueSrc });
  }
  function restoreState(){
    const s = LS.get('state', null);
    if (s) s.id = fixId(s.id);
    if (!s || !lib[s.id]) return;
    queueSrc = panelDefs[s.qp] ? s.qp : 'p0';
    let ids = panelDefs[queueSrc].get().filter(id => lib[id]);
    if (!ids.includes(s.id)) { ids = libOrder.slice(); queueSrc = 'p0'; }
    queue = ids;
    loadTrack(s.id, false, s.t || 0);
    toast('上次听到「' + lib[s.id].title + '」' + formatTime(s.t || 0) + '，点播放继续');
  }
  window.addEventListener('pagehide', saveState);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });

  /* ================= 播放模式 ================= */
  const MODES = ['order', 'one', 'shuffle'];
  const MODE_META = { order: { icon: ICON_ORDER, name: '顺序播放' }, one: { icon: ICON_ONE, name: '单曲循环' }, shuffle: { icon: ICON_SHUF, name: '随机播放' } };
  function setMode(m, silent){
    if (!MODE_META[m]) m = 'order';
    mode = m; LS.set('mode', m); shuffleHist = [];
    btnMode.innerHTML = MODE_META[m].icon; btnMode.classList.toggle('on', m !== 'order');
    btnMode.setAttribute('aria-label', MODE_META[m].name); btnMode.title = MODE_META[m].name;
    if (!silent) toast(MODE_META[m].name);
  }
  btnMode.addEventListener('click', () => setMode(MODES[(MODES.indexOf(mode) + 1) % MODES.length]));

  /* ================= 锁屏 / 耳机控制 ================= */
  function updateMedia(m){
    if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: m.title, artist: artistName(m.artist), album: '音乐馆',
        artwork: m.cover ? [{ src: new URL(m.cover, location.href).href }] : []
      });
    } catch (e) {}
  }
  function updatePosition(){
    if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState || !isSrcMode) return;
    const d = player.duration;
    if (!isFinite(d) || d <= 0) return;
    try { navigator.mediaSession.setPositionState({ duration: d, playbackRate: playbackRate, position: clamp(player.currentTime, 0, d) }); } catch (e) {}
  }
  (function setupMediaSession(){
    if (!('mediaSession' in navigator)) return;
    const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
    h('play', () => { if (!isPlaying) togglePlay(); });
    h('pause', () => { if (isPlaying) togglePlay(); });
    h('previoustrack', () => go(-1, true));
    h('nexttrack', () => go(1, true));
    h('seekbackward', () => seekBy(-10));
    h('seekforward', () => seekBy(10));
    h('seekto', d => { if (d.seekTime != null) seekTo(d.seekTime); });
  })();

  /* ================= 控制键 ================= */
  btnPlay.addEventListener('click', togglePlay);
  btnPrev.addEventListener('click', () => go(-1, true));
  btnNext.addEventListener('click', () => go(1, true));
  btnFav.addEventListener('click', () => { if (curId) toggleFav(curId); else toast('先选一首歌吧'); });
  moreBtn.addEventListener('click', () => {
    const on = stage.classList.toggle('expanded');
    moreBtn.setAttribute('aria-expanded', on ? 'true' : 'false');
    setTimeout(sizeViz, 0);
  });

  /* ================= 点歌 / 收藏心（事件委托） ================= */
  let justDragged = false;
  document.addEventListener('click', e => {
    if (justDragged) return;
    const f = e.target.closest('.track-fav');
    if (f) { toggleFav(f.closest('.track').dataset.id); return; }
    const t = e.target.closest('.track'); if (!t) return;
    const id = t.dataset.id;
    if (id === curId) { togglePlay(); return; }
    const cont = t.parentElement;
    const panel = t.closest('.coll-panel');
    startQueue(Array.from(cont.querySelectorAll('.track')).map(x => x.dataset.id), panel ? panel.id : 'p0', id);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target.closest ? e.target.closest('.track') : null;
    if (!t || e.target !== t) return;
    e.preventDefault(); t.click();
  });

  /* ================= 键盘快捷键 ================= */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !lyrFull.hidden) { closeLyrics(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if ((e.key === ' ' || e.key === 'Enter') && (tag === 'button' || (e.target.closest && e.target.closest('.track')))) return;
    switch (e.key) {
      case ' ': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': e.preventDefault(); seekBy(-5); break;
      case 'ArrowRight': e.preventDefault(); seekBy(5); break;
      case 'n': case 'N': go(1, true); break;
      case 'p': case 'P': go(-1, true); break;
    }
  });

  /* ================= 拖动排序 ================= */
  let dnd = null;
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const n = e.target.closest('.track.sortable .track-num'); if (!n) return;
    const row = n.closest('.track');
    dnd = { row, cont: row.parentElement, startY: e.clientY, moved: false, before: null };
    row.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('pointermove', e => {
    if (!dnd) return;
    if (Math.abs(e.clientY - dnd.startY) > 4) dnd.moved = true;
    if (!dnd.moved) return;
    dnd.row.style.transform = 'translateY(' + (e.clientY - dnd.startY) + 'px)';
    const sibs = Array.from(dnd.cont.querySelectorAll('.track')).filter(s => s !== dnd.row);
    sibs.forEach(s => s.classList.remove('drop-before', 'drop-after'));
    dnd.before = null;
    for (const s of sibs) { const r = s.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { dnd.before = s; break; } }
    if (dnd.before) dnd.before.classList.add('drop-before');
    else if (sibs.length) sibs[sibs.length - 1].classList.add('drop-after');
  });
  function endDrag(){
    if (!dnd) return;
    const { row, cont, moved, before } = dnd; dnd = null;
    row.classList.remove('dragging'); row.style.transform = '';
    cont.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
    if (!moved) return;
    cont.insertBefore(row, before || null);
    const pid = cont.closest('.coll-panel').id;
    const ids = Array.from(cont.querySelectorAll('.track')).map(x => x.dataset.id);
    panelDefs[pid].set(ids);
    if (queueSrc === pid) queue = ids.slice();
    cont.querySelectorAll('.track-num').forEach((x, i) => { x.textContent = pad2(i + 1); });
    justDragged = true; setTimeout(() => { justDragged = false; }, 60);
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', () => { if (dnd) dnd.moved = false; endDrag(); });

  /* ================= 搜索 / 排序 / 随便听听 ================= */
  const homeSearch = $('homeSearch'), searchRes = $('searchRes');
  homeSearch.addEventListener('input', () => {
    const q = homeSearch.value.trim().toLowerCase();
    document.body.classList.toggle('searching', !!q);
    searchRes.hidden = !q;
    if (!q) { searchRes.replaceChildren(); return; }
    const ids = libOrder.filter(id => matchQ(id, q));
    renderTracks(searchRes, ids, false, true);
    if (!ids.length) searchRes.innerHTML = '<p class="empty">没有匹配的歌曲</p>';
  });
  document.querySelectorAll('.coll-panel').forEach(panel => {
    const pid = panel.id;
    const s = panel.querySelector('.panel-search');
    if (s) s.addEventListener('input', () => { view[pid].q = s.value.trim().toLowerCase(); renderPanel(pid, true); });
    const so = panel.querySelector('.sort');
    if (so) so.addEventListener('change', () => { view[pid].sort = so.value; renderPanel(pid, true); });
  });
  $('btnLucky').addEventListener('click', () => {
    if (!libOrder.length) { toast('还没有歌曲'); return; }
    if (mode !== 'shuffle') setMode('shuffle', true);
    startQueue(libOrder, 'p0', libOrder[Math.floor(Math.random() * libOrder.length)]);
    toast('随便听听 · 随机播放');
  });

  /* ================= 我的收藏：路由 ================= */
  const colls = document.querySelectorAll('.coll');
  const panels = document.querySelectorAll('.coll-panel');
  let fromHome = false;
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  let homeScroll = 0;
  function route(){
    const wasIn = document.body.classList.contains('in-coll');
    const parts = location.hash.slice(1).split('/');
    const pid = parts[0];
    const panel = pid ? document.getElementById(pid) : null;
    const ok = !!(panel && panel.classList.contains('coll-panel') && panelDefs[pid]);
    panels.forEach(p => { p.hidden = true; });
    colls.forEach(c => c.classList.toggle('open', ok && c.dataset.target === pid));
    if (ok && !wasIn) homeScroll = window.scrollY;
    document.body.classList.toggle('in-coll', ok);
    if (!ok) { if (wasIn) window.scrollTo({ top: homeScroll, behavior: 'instant' }); return; }
    window.scrollTo({ top: 0, behavior: 'instant' });
    renderPanel(pid, false); updateCounts();
    panel.hidden = false;
  }
  function goHome(){
    if (fromHome) { history.back(); return; }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    route();
  }
  colls.forEach(card => card.addEventListener('click', () => { fromHome = true; location.hash = card.dataset.target; }));
  document.querySelectorAll('.panel-close').forEach(b => b.addEventListener('click', goHome));
  window.addEventListener('hashchange', route);

  /* ================= 深色模式（默认按时间自动） ================= */
  const themeBtn = $('themeBtn');
  const ICON_THEME_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const ICON_SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    themeBtn.innerHTML = t === 'dark' ? ICON_SUN : ICON_THEME_MOON;
    themeBtn.setAttribute('aria-label', t === 'dark' ? '切换浅色模式' : '切换深色模式');
    refreshVizColor();
  }
  function animTheme(t){
    const root = document.documentElement;
    root.classList.add('theme-anim'); applyTheme(t);
    setTimeout(() => root.classList.remove('theme-anim'), 600);
  }
  function autoTheme(){
    let stored = null; try { stored = localStorage.getItem('theme'); } catch (e) {}
    if (stored) return;
    const h = new Date().getHours(), t = (h >= 19 || h < 6) ? 'dark' : 'light';
    if (document.documentElement.dataset.theme !== t) animTheme(t);
  }
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    animTheme(next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
  themeBtn.addEventListener('dblclick', () => {
    try { localStorage.removeItem('theme'); } catch (e) {}
    autoTheme(); toast('已恢复自动主题（19:00–06:00 深色）');
  });
  setInterval(autoTheme, 60000);

  /* ================= 初始化 ================= */
  btnPrev.innerHTML = ICON_PREV; btnNext.innerHTML = ICON_NEXT; btnPlay.innerHTML = ICON_PLAY;
  lyrPrev.innerHTML = ICON_PREV; lyrNext.innerHTML = ICON_NEXT; lyrPlay.innerHTML = ICON_PLAY;
  btnFav.innerHTML = ICON_HEART; moreBtn.innerHTML = ICON_DOTS;
  setMode(MODE_META[mode] ? mode : 'order', true);
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
  updateCounts();
  new ResizeObserver(sizeViz).observe(vizC);
  window.addEventListener('load', sizeViz);
  sizeViz();
  restoreState();
  route();
</script>

</body>
</html>
